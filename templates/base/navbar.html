<header class="navbar navbar-expand-lg border-bottom bg-white">

    <div class="container-fluid">

        <div class="d-flex align-items-center">
            <h3 class="mb-0 fw-bold">
                {% block page_title %}Dashboard{% endblock %}
            </h3>
        </div>

        <div class="d-flex align-items-center ms-auto gap-3">

            <button
                type="button"
                class="btn btn-icon btn-outline-primary"
                data-voice-toggle
                aria-label="Comando vocale"
                title="Comando vocale">
                <i class="ti ti-microphone"></i>
            </button>

            <button
                type="button"
                class="btn btn-icon btn-outline-secondary"
                data-theme-toggle
                aria-label="Attiva tema scuro"
                title="Attiva tema scuro">
                <i class="ti ti-moon" data-theme-toggle-icon></i>
            </button>

            <div class="dropdown">
                <a href="#"
                   class="d-flex align-items-center text-decoration-none"
                   data-bs-toggle="dropdown">
                    <div class="avatar avatar-sm bg-primary text-white">
                        {{ request.user.first_name|default:request.user.username|first|upper }}
                    </div>
                    <div class="ms-2 text-start">
                        <div class="fw-semibold">
                            {{ request.user.get_full_name|default:request.user.username }}
                        </div>
                        <small class="text-secondary">Utente</small>
                    </div>
                </a>
                <div class="dropdown-menu dropdown-menu-end">
                    <a class="dropdown-item" href="{% url 'dashboard:sistema' %}">
                        Impostazioni
                    </a>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item text-danger" href="{% url 'logout' %}">
                        Logout
                    </a>
                </div>
            </div>

        </div>

    </div>

</header>
