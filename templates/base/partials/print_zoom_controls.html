<div class="eureka-print-zoom" role="group" aria-label="Zoom anteprima">
    <button type="button" class="eureka-print-btn eureka-print-zoom__btn" data-print-zoom="out" title="Riduci (Ctrl −)">−</button>
    <button type="button" class="eureka-print-zoom__value" data-print-zoom="reset" data-print-zoom-label title="Ripristina 100% (Ctrl 0)">100%</button>
    <button type="button" class="eureka-print-btn eureka-print-zoom__btn" data-print-zoom="in" title="Ingrandisci (Ctrl +)">+</button>
</div>
