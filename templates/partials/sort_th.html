{% load pagination_tags %}
<th class="eureka-sort-th{% if active %} is-active{% endif %}{% if align %} text-{{ align }}{% endif %}">
    <a href="{% sort_url field default_dir %}"
       class="eureka-sort-th__link text-reset text-decoration-none d-inline-flex align-items-center gap-1{% if align == 'end' %} justify-content-end w-100{% endif %}{% if align == 'center' %} justify-content-center w-100{% endif %}"
       title="Ordina per {{ label }}">
        <span>{{ label }}</span>
        {% if active %}
            {% if dir == 'asc' %}
            <i class="ti ti-chevron-up eureka-sort-th__icon" aria-hidden="true"></i>
            {% else %}
            <i class="ti ti-chevron-down eureka-sort-th__icon" aria-hidden="true"></i>
            {% endif %}
        {% else %}
            <i class="ti ti-selector text-secondary eureka-sort-th__icon eureka-sort-th__icon--idle" aria-hidden="true"></i>
        {% endif %}
    </a>
</th>
